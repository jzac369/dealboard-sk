name: Zdieľanie na Facebook

# Zdiela cerstvo schvalene dealy na facebookovu stranku. Dvakrat denne,
# najviac dva prispevky na beh - viac by z casovej osi urobilo spam.
#
# Bez FB_PAGE_ID a FB_PAGE_TOKEN skript nic neurobi a skonci v poriadku,
# takze workflow moze bezat aj pred nastavenim tokenu.

on:
  # Kedy sa to spusti, urcuje planovac (planovac.yml) podla
  # rozvrhu v admin zone. Pevny cron tu zamerne nie je.
  workflow_dispatch:
    inputs:
      diag:
        description: "Len diagnostika - zisti, preco Facebook odmieta prispevky"
        type: boolean
        default: false
      rezim:
        description: "auto = rozvrh (naplanovane aj automaticke), naplanovane = len prispevky naplanovane v admine"
        type: choice
        options: [auto, naplanovane]
        default: auto

concurrency:
  group: facebook
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  zdielat:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: deal-hunter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deal-hunter/requirements.txt

      - name: Inštalácia závislostí
        run: pip install -r requirements.txt

      - name: Zápis Firebase kľúča
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > firebase-credentials.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Zdieľanie
        run: python facebook_post.py
        env:
          FIRESTORE_PROJECT_ID: dealboard-e60bf
          GOOGLE_APPLICATION_CREDENTIALS: firebase-credentials.json
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_DIAGNOSTICS: ${{ inputs.diag }}
          FB_REZIM: ${{ inputs.rezim || 'auto' }}

      - name: Zmazanie kľúča
        if: always()
        run: rm -f firebase-credentials.json
