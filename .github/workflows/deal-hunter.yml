name: Deal Hunter

on:
  schedule:
    # 3x denne. Časy sú v UTC; Slovensko je +2 h v lete, +1 h v zime.
    # 05:30 UTC -> 07:30 SK (leto) / 06:30 SK (zima)
    - cron: "30 5 * * *"
    # 10:30 UTC -> 12:30 SK (leto)
    - cron: "30 10 * * *"
    # 16:30 UTC -> 18:30 SK (leto)
    - cron: "30 16 * * *"
  workflow_dispatch:
    # Umožní manuálne spustenie z GitHub UI (záložka Actions).
    inputs:
      dry_run:
        description: "Len vypísať nájdené dealy, nezapisovať do databázy"
        type: boolean
        default: false
      reset_pending:
        description: "Čistý štart: zmazať NESCHVÁLENÉ návrhy od agenta a jeho pamäť"
        type: boolean
        default: false
      vote_boost:
        description: "Jednorazovo: dať dealom bez hlasov štartovací žiar 5-25 stupňov"
        type: boolean
        default: false
      coupon_boost:
        description: "Jednorazovo: dať zľavovým kódom bez hlasov žiar 5-35 (časť záporných)"
        type: boolean
        default: false
      feed_diagnostics:
        description: "Len vypísať štruktúru feedov (nič sa nezapíše)"
        type: boolean
        default: false
      fix_urls:
        description: "Jednorazovo: prepísať staré odkazy zo zdroja na predajcu"
        type: boolean
        default: false
      categories:
        description: "Len tieto kategórie (čiarkou, prázdne = všetky). Napr: naradie,hracky,obuv"
        type: string
        default: ""
      max_deals:
        description: "Koľko návrhov pridať (prázdne = 10, teda 30 denne pri 3 behoch)"
        type: string
        default: ""

# Tieto behy do repozitara nic nezapisuju - citaju kod a pisu do
# Firestore. Najuzsie mozne opravnenia tokenu.
permissions:
  contents: read

# Dva behy naraz by mohli zapisat tie iste dealy dvakrat -
# deduplikacia sa opiera o pamat, ktoru druhy beh este nevidi.
concurrency:
  group: deal-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        # Agent zije vo vlastnom podpriecinku, aby sa nemiesal so strankou.
        working-directory: deal-hunter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deal-hunter/requirements-dev.txt

      - name: Inštalácia závislostí
        run: pip install -r requirements-dev.txt

      - name: Testy parsovania
        # Ak sa rozbil parser, nemá zmysel zapisovať nezmysly do databázy.
        run: python -m pytest tests/ -q

      - name: Zápis Firebase kľúča
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > firebase-credentials.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Spustenie Deal Huntera
        run: python main.py
        env:
          FIRESTORE_PROJECT_ID: dealboard-e60bf
          DRY_RUN: ${{ inputs.dry_run }}
          RESET_PENDING: ${{ inputs.reset_pending }}
          FIX_URLS: ${{ inputs.fix_urls }}
          # Pri plánovanom behu je `inputs` prázdne, takže sa dosadí 0 a
          # boost je vypnutý. Zapne sa len ručným zaškrtnutím vo formulári.
          VOTE_BOOST_MIN: ${{ inputs.vote_boost && 5 || 0 }}
          VOTE_BOOST_MAX: ${{ inputs.vote_boost && 25 || 0 }}
          COUPON_BOOST_MIN: ${{ inputs.coupon_boost && 5 || 0 }}
          COUPON_BOOST_MAX: ${{ inputs.coupon_boost && 35 || 0 }}
          MIN_DISCOUNT_PERCENT: "25"
          # Prázdny vstup necháva predvolenú hodnotu z config.py.
          MAX_DEALS_PER_RUN: ${{ inputs.max_deals || '10' }}
          ZLACNENE_CATEGORIES: ${{ inputs.categories }}
          # Affiliate feedy (Dognet) — nastav ako repository secret.
          # Bez neho beží len zlacnene.sk, čo je v poriadku.
          FEED_URLS: ${{ secrets.FEED_URLS }}
          AFFILIATE_LINK_TEMPLATE: ${{ secrets.AFFILIATE_LINK_TEMPLATE }}
          FEED_DIAGNOSTICS: ${{ inputs.feed_diagnostics }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Zmazanie kľúča
        # `always()` = zmaže sa aj keď predchádzajúci krok zlyhal.
        if: always()
        run: rm -f firebase-credentials.json
