name: Plánovač

# Kazdych 5 minut sa pozrie do settings/schedule, co je na rade, a
# spusti to. Casy sa menia v admin zone - nie tu. Cron v jednotlivych
# workflow zamerne nie je: casy v nich by sa z admina menit nedali.
#
# Beh je dlha slucka (~5 h 40 min), ktora pred koncom spusti nastupcu -
# GitHub cron "*/15" v skutocnosti chodil len raz za 4-5 hodin. Cron
# nizsie je uz len zaloha, ktora retaz obnovi, keby sa pretrhla.
#
# Repozitar je verejny, takze GitHub Actions minuty su zadarmo a tato
# casta kontrola nic nestoji.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      nasucho:
        description: "Len vypisat, co by sa spustilo"
        type: boolean
        default: false

# Dve kontroly naraz by mohli spustit tu istu ulohu dvakrat.
concurrency:
  group: planovac
  cancel-in-progress: false

permissions:
  contents: read
  actions: write      # spustanie ostatnych workflow

jobs:
  planovac:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    defaults:
      run:
        working-directory: deal-hunter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deal-hunter/requirements.txt

      - name: Inštalácia závislostí
        run: pip install -r requirements.txt

      - name: Zápis Firebase kľúča
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > firebase-credentials.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Kontrola rozvrhu
        run: python planovac.py ${{ inputs.nasucho && '--nasucho' || '--slucka' }}
        env:
          FIRESTORE_PROJECT_ID: dealboard-e60bf
          GOOGLE_APPLICATION_CREDENTIALS: firebase-credentials.json
          GH_TOKEN: ${{ github.token }}
          # Naplánované dealy sa v určený čas posielajú na schválenie.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Zmazanie kľúča
        if: always()
        run: rm -f firebase-credentials.json
