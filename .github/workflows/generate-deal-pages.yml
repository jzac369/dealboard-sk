name: Generuj SEO stránky dealov

on:
  schedule:
    # Kazde tri hodiny. Pri kazdom behu sa cita cela kolekcia dealov aj
    # kuponov, takze hodinovy beh stal okolo 5 % dennej kvoty Firestore
    # za nieco, co sa meni parkrat denne. Cerstvo schvaleny deal ma svoju
    # stranku aj tak skoro - dalsi beh je najneskor o tri hodiny.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-deal-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-cloud-firestore Pillow

      - name: Write Firebase credentials
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > firebase-credentials.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Generate deal pages + sitemap
        run: python generate_deal_pages.py
        env:
          FIRESTORE_PROJECT_ID: dealboard-e60bf

      # Logá nových obchodov: už stiahnuté sa preskočia, takže bežne to
      # netrvá ani sekundu. Chyba tu nesmie zastaviť stránky dealov.
      - name: Download logos of new shops
        continue-on-error: true
        run: python deal-hunter/fetch_shop_logos.py
        env:
          FIRESTORE_PROJECT_ID: dealboard-e60bf

      - name: Cleanup credentials file
        if: always()
        run: rm -f firebase-credentials.json

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deal/ sitemap.xml assets/eshopy/
          git diff --cached --quiet || git commit -m "Auto-generovanie SEO stránok dealov"
          git push
