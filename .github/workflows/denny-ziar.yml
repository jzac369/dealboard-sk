name: Denný žiar dealom

# Kym na stranku nechodia pravidelni navstevnici, dostane kazdy
# publikovany deal denne 1 az 5 hlasov. Riadi sa to prepinacom v admin
# zone (settings/moderation -> dailyHeatBoost); ked je vypnuty, beh
# skonci hned a nic nezmeni.
#
# Bezi v cloude, takze nepotrebuje zapnuty pocitac.

on:
  # Kedy sa to spusti, urcuje planovac (planovac.yml) podla
  # rozvrhu v admin zone. Pevny cron tu zamerne nie je.
  workflow_dispatch: {}

concurrency:
  group: denny-ziar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ziar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: deal-hunter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deal-hunter/requirements.txt

      - name: Inštalácia závislostí
        run: pip install -r requirements.txt

      - name: Zápis Firebase kľúča
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > firebase-credentials.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Pridanie žiaru
        run: python denny_ziar.py
        env:
          FIRESTORE_PROJECT_ID: dealboard-e60bf
          GOOGLE_APPLICATION_CREDENTIALS: firebase-credentials.json

      - name: Zmazanie kľúča
        if: always()
        run: rm -f firebase-credentials.json
