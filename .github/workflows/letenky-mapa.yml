name: Letenková mapa

# Ceny leteniek pre záložku Letenky: pre každú trasu z BTS, VIE a KSC
# najlacnejšia cena na každý deň tam aj späť. Výsledok je statický
# súbor assets/letenky/ceny.json - stránka ho načíta priamo, bez
# Firestore. Kedy sa to spustí, určuje plánovač podľa rozvrhu v admine.

on:
  workflow_dispatch: {}

concurrency:
  group: letenky-mapa
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  letenky-mapa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inštalácia závislostí
        run: pip install requests

      - name: Stiahnutie cien
        run: python deal-hunter/letenky_mapa.py

      - name: Uloženie
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/letenky/ceny.json
          git diff --cached --quiet && exit 0
          git commit -m "Letenková mapa: aktualizácia cien"
          # Medzitým mohol niekto (napr. generovanie stránok) pushnúť.
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
