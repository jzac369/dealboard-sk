name: Publikovanie tipov

# Spusti ho admin (Tipy medzi dealmi) cez plánovač. Obrázky nahrané v
# admine zmení na súbory v assets/tipy/ a commitne ich, aby ich stránka
# servírovala z GitHub Pages.

on:
  workflow_dispatch: {}

concurrency:
  group: tipy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tipy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deal-hunter/requirements.txt

      - name: Inštalácia závislostí
        working-directory: deal-hunter
        run: pip install -r requirements.txt pillow

      - name: Zápis Firebase kľúča
        working-directory: deal-hunter
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > firebase-credentials.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Publikovanie tipov
        working-directory: deal-hunter
        run: python tipy_publikuj.py

      - name: Commit
        run: |
          git config user.name "HenKukaj bot"
          git config user.email "bot@henkukaj.sk"
          git add assets/tipy
          git diff --cached --quiet || git commit -m "Tipy medzi dealmi: aktualizácia obrázkov"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
