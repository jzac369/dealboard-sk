name: Telegram schvaľovanie

# Telegram tlačidlá bežne obsluhuje server s verejnou adresou (webhook).
# Taký nemáme, tak sa Telegramu pýtame sami.
#
# Pôvodne to bol cron každých 15 minút, lenže GitHub tak časté úlohy
# nedodržiava - v praxi ich púšťal raz za dve až päť hodín a schválenie
# dealu sa prejavilo až s takým oneskorením.
#
# Teraz beží jeden spustený beh 55 minút a používa dlhé dopytovanie:
# Telegram podrží spojenie a odpovie hneď po stlačení tlačidla. Reakcia
# je preto v sekundách a cron stačí hodinový, čo GitHub zvláda.
on:
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch:
    inputs:
      diag:
        description: "Len diagnostika - zistí, prečo sa stlačenia nespracúvajú"
        type: boolean
        default: false
      seconds:
        description: "Ako dlho počúvať (prázdne = 3300 s, teda 55 min)"
        type: string
        default: ""

# Dva behy naraz by si navzájom brali stlačenia z tej istej fronty.
concurrency:
  group: telegram-approve
  cancel-in-progress: false

# Po schvaleni sa hned generuju stranky dealov, tie sa commituju.
permissions:
  contents: write
  actions: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: deal-hunter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deal-hunter/requirements.txt

      - name: Inštalácia závislostí
        run: pip install -r requirements.txt

      - name: Zápis Firebase kľúča
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > firebase-credentials.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Vyzdvihnutie rozhodnutí
        run: python poll_telegram.py
        env:
          FIRESTORE_PROJECT_ID: dealboard-e60bf
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DIAG: ${{ inputs.diag }}
          POLL_SECONDS: ${{ inputs.seconds }}

      # Zdielanie dealu na socialnej sieti potrebuje jeho vlastnu
      # stranku s Open Graph tagmi. Bez tohto kroku by na nu cakal az do
      # najblizsej hodiny a dovtedy by Facebook zobrazoval len logo
      # stranky namiesto fotky dealu.
      - name: Vygenerovanie stránok práve schválených dealov
        if: always()
        working-directory: .
        run: python generate_deal_pages.py
        env:
          FIRESTORE_PROJECT_ID: dealboard-e60bf
          FIREBASE_CREDENTIALS_PATH: deal-hunter/firebase-credentials.json

      - name: Zverejnenie stránok
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deal/ sitemap.xml
          git diff --cached --quiet || git commit -m "Stranky dealov po schvaleni z Telegramu"
          git pull --rebase --autostash || true
          git push

      - name: Zmazanie kľúča
        if: always()
        run: rm -f firebase-credentials.json
