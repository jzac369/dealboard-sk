name: Kayak sandbox - skuska

# Jednorazove overenie, ze sandboxovy kluc funguje a ako sa posiela.
# Ziadny rozvrh - spusta sa rucne z Actions.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skuska:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deal-hunter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skuska kluca
        run: python kayak_skuska.py
        env:
          KAYAK_API_KEY: ${{ secrets.KAYAK_API_KEY }}
