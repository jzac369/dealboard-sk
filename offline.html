<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E8590C">
<title>Bez pripojenia – HenKukaj.sk</title>
<style>
  :root { --orange: #E8590C; --ink: #1A1A1A; --muted: #6B6B6B; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif; background: #F5F5F3; color: var(--ink); text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #17191C; color: #ECECEC; } }
  img { width: 112px; height: 112px; border-radius: 26px; }
  h1 { font-size: 1.4rem; margin: 18px 0 8px; }
  p { color: var(--muted); max-width: 320px; margin: 0 auto 22px; line-height: 1.5; }
  button { background: var(--orange); color: #fff; border: 0; border-radius: 12px; padding: 14px 26px; font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/assets/icon-192.png?v=2" alt="">
    <h1>Si offline</h1>
    <p>Zdá sa, že nemáš pripojenie na internet. Dealy sa načítajú, hneď ako sa pripojíš.</p>
    <button type="button" onclick="location.reload()">Skúsiť znova</button>
  </main>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
